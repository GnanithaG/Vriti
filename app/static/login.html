<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — JobPilot</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { max-width: 360px; padding-top: 80px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    .auth-footer { margin-top: 16px; font-size: 0.9em; color: var(--muted); }
  </style>
</head>
<body>
  <h1>JobPilot</h1>
  <p class="tagline">Log in to your account.</p>

  <form id="login-form">
    <label>Email <input type="email" name="email" required autofocus /></label>
    <label>Password <input type="password" name="password" required /></label>
    <button type="submit">Log in</button>
    <span id="login-status" class="status"></span>
  </form>

  <p class="auth-footer">No account yet? <a href="/register">Register</a></p>

  <script>
    const form = document.getElementById("login-form");
    const status = document.getElementById("login-status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Logging in…";
      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        window.location.href = "/careers";
      } catch (err) {
        status.textContent = err.message;
      }
    });
  </script>
</body>
</html>
