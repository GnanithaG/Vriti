<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>JobPilot</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.tagline { font-size: 11px; color: #666; margin: 0 0 12px; }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      background: #2f6feb;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { font-size: 12px; color: #444; min-height: 32px; }
    a { font-size: 11px; color: #2f6feb; }
  </style>
</head>
<body>
  <h1>JobPilot</h1>
  <p class="tagline">You always press Submit. JobPilot never does.</p>
  <button id="capture-btn">Capture this job</button>
  <button id="prefill-btn">Preview prefill on this page</button>
  <div id="status"></div>
  <a href="http://127.0.0.1:8000/" target="_blank">Open dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
